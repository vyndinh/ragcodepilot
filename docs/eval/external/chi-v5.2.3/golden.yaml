# Frozen external chi v5.2.3 query set; labels authored before retrieval.
# Source commit: 9b9fb55def404397748a9fc7e044efe9db1d618e
# File-only positives: hit@5 means any expected file; recall measures the required file set.
# top1_score_below is the dense cosine field; the unchanged hybrid runner uses RRF 0.02.
queries:
